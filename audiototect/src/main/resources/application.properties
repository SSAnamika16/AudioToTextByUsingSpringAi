spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1

# Audio transcription
spring.ai.openai.audio.transcription.base-url=https://api.groq.com/openai/v1
spring.ai.openai.audio.transcription.api-key=${GROQ_API_KEY}
spring.ai.openai.audio.transcription.model=whisper-large-v3
spring.ai.openai.audio.transcription.response-format=text
spring.ai.openai.audio.transcription.temperature=0.7

# Chat model
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7